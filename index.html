*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#606266;font:13px -apple-system,BlinkMacSystemFont,"Microsoft YaHei",sans-serif}header{height:54px;background:white;border-bottom:1px solid #e7eaf0;padding:18px 24px;color:#303133;font-size:16px}main{margin:18px;background:white;padding:0 20px 20px}.tabs{display:flex;border-bottom:1px solid #e6e9ef;gap:32px;height:48px;align-items:center}.tab{border:0;background:none;height:48px;color:#606266;cursor:pointer}.tab.active{color:#409eff;border-bottom:2px solid #409eff}.notice{margin:16px 0;background:#ecf5ff;border:1px solid #d9ecff;padding:12px;color:#547598;border-radius:4px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0}input,select,textarea{font:inherit;border:1px solid #dcdfe6;border-radius:4px;padding:9px;color:#606266;background:white}input{width:180px}input[type=date]{width:144px}button{font:inherit;border-radius:4px;border:1px solid #dcdfe6;padding:8px 13px;background:white;color:#606266;cursor:pointer}button:hover{opacity:.85}.blue{background:#409eff;color:white;border-color:#409eff}.orange{background:#ff9824;border-color:#ff9824;color:white}.quick{color:#409eff;border-color:#b3d8ff;background:#ecf5ff}.summary{display:flex;flex-wrap:wrap;gap:12px;margin:18px 0}.card{border:1px solid #ebeef5;border-radius:5px;padding:14px 18px;min-width:155px}.card b{font-size:23px;color:#303133;margin-left:16px}.tablewrap{overflow:auto}table{width:100%;min-width:1720px;border-collapse:collapse;font-size:12px}th{text-align:left;background:#f0f2f5;color:#858a92;font-weight:500;padding:15px 10px;line-height:21px}td{padding:17px 10px;border-bottom:1px solid #ebeef5;line-height:23px;vertical-align:top}tr:nth-child(even){background:#fafcff}a{color:#409eff;cursor:pointer;text-decoration:none}.muted{color:#909399}.tag{display:inline-block;padding:0 7px;border-radius:3px;line-height:23px;white-space:nowrap}.warn{color:#e6a23c;background:#fdf6ec;border:1px solid #faecd8}.info{color:#909399;bac </style><header>超时订单核对 <span class="demo">静态交互 Mock · 全部为示例数据</span></header><main><div class="tabs"><button class="tab active" data-channel="银行卡">银行卡</button><button class="tab" data-channel="支付宝">支付宝</button></div><div class="notice">ⓘ 本页面仅记录付款超时后收到用户确认付款通知的订单，未收到通知的订单不纳入。是否实际付款需运营核对。核对操作仅更新本页面记录，不修改原交易订单。</div><div class="toolbar"><select id="searchType"><option value="order">充值订单号</option><option value="merchantOrder">商户充值订单号</option><option value="withdraw">提现订单号</option><option value="merchantWithdraw">商户提现订单号</option></select><input id="keyword" placeholder="请输入订单号"><input type="date" id="from" value="2026-10-12"><span>至</span><input type="date" id="to" value="2026-10-12"><button class="quick" data-days="1">今日</button><button class="quick" data-days="3">近3日</button><button class="quick" data-days="7">近7日</button><select id="review"><option value="">全部核对状态</option><option>待核对</option><option>已核对</option></select><button id="reset">↻ 重置</button><button class="blue" id="query">⌕ 查询</button><button class="orange" id="export">⇩ 导出</button></div><div class="summary"><div class="card">全部订单<b id="total">0</b><div style="margin-top:12px">订单总额：<strong id="amount">—</strong></div></div><div class="card">待核对<b id="pending" style="color:#e6a23c">0</b><div style="margin-top:12px">订单总额：<strong id="pendingAmount">—</strong></div></div><div class="card">已核对<b id="done" style="color:#67c23a">0</b><div style="margin-top:12px">订单总额：<strong id="doneAmount">—</strong></div></div></div><div class="muted" style="margin-bottom:16px;font-size:12px">统计覆盖当前筛选结果的全部订单；金额按原充值订单金额汇总（人民币），不代表实际付款金额。</div><div class="tablewrap"><table><thead><tr><th>充值用户</th><th>商户名称<br>充值订单号<br>商户充值订单号</th><th>提现订单号<br>商户提现订单号</th><th>金额（元）</th><th>充值交易状态</th><th>关联提现状态</th><th>下单时间<br>超时时间</th><th>确认付款时间</th><th>核对状态</th><th>核对备注</th><th>核对人<br>核对时间</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><div class="foot"><span id="count"></span><div class="pagination"><span>20 条 / 页</span><button disabled>‹</button><button class="blue">1</button><button disabled>›</button></div></div></main><div class="overlay" id="overlay"><div class="dialog"><h2 id="title"></h2><div class="content" id="body"></div><footer id="footer"></footer></div></div><div class="toast" id="toast"></div><script>
const records=Array.from({length:8},(_,i)=>({id:i,channel:i<6?'银行卡':'支付宝',user:'20849292216835850'+i,name:['tbh1112','xk66665','Yokayi1','bonnie006'][i%4],merchantUser:100080+i,merchant:'星辰商户',order:'210849845139788'+(1856+i),merchantOrder:'CZ202610120'+(10025+i)+'XDI',withdraw:'210849328595731660'+(i%3),merchantWithdraw:'TX202610120942079J'+(i%3),amount:[200,400,300,600,200,1500,300,500][i],currency:'CNY',trade:'已取消',withdrawState:['交易中','已完成','交易中','已取消'][i%4],created:'2026-10-12 '+['19:02:59','18:44:10','18:31:09','18:20:33','18:05:49','17:54:43','17:30:00','17:05:00'][i],timeout:'2026-10-12 '+['19:17:59','18:59:10','18:46:09','18:35:33','18:20:49','18:09:43','17:45:00','17:20:00'][i],clicked:'2026-10-12 '+['19:21:03','19:05:18','18:52:10','18:42:06','18:28:22','18:16:35','17:50:00','17:26:12'][i],review:i===2||i===3?'已核对':'待核对',note:i===2?'已与双方核对，记录备查':i===3?'已与用户核对，备注备查':'',operator:i===2||i===3?'运营 · 林晓':'',reviewTime:i===2||i===3?'2026-10-12 19:30:26':'',history:[]}));let channel='银行卡',visible=[],current=null;const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){visible=records.filter(r=>r.channel===channel&&(!$('keyword').value||r[$('searchType').value].includes($('keyword').value.trim()))&&(!$('review').value||r.review===$('review').value)&&(!$('from').value||r.timeout.slice(0,10)>=$('from').value)&&(!$('to').value||r.timeout.slice(0,10)<=$('to').value));$('rows').innerHTML=visible.map(r=>`<tr><td>平台用户ID：<br>${r.user}<br>商户用户名：${r.name}<br>商户用户ID：${r.merchantUser}</td><td>${r.merchant}<br><a data-view="${r.id}">${r.order}</a><br>${r.merchantOrder}</td><td>${r.withdraw}<br>${r.merchantWithdraw}</td><td>¥${r.amount.toFixed(2)}</td><td style="color:${r.trade==='已完成'?'#67c23a':'#f56c6c'}">${r.trade}</td><td style="color:${r.withdrawState==='已完成'?'#67c23a':r.withdrawState==='已取消'?'#f56c6c':'#e6a23c'}">${r.withdrawState}</td><td>${r.created}<br><span class="muted">${r.timeout}</span></td><td>${r.clicked}</td><td><span class="tag ${r.review==='已核对'?'success':'warn'}">${r.review}</span></td><td style="max-width:170px">${esc(r.note)||'—'}</td><td>${r.operator||'—'}<br>${r.reviewTime||''}</td><td class="actions"><button data-view="${r.id}">查看</button>${r.review==='待核对'?`<button data-check="${r.id}">核对</button>`:''}</td></tr>`).join('')||'<tr><td colspan="12" class="empty">暂无符合条件的记录</td></tr>';$('total').textContent=visible.length;const formatAmount=items=>{const totals={};items.forEach(r=>totals[r.currency]=(totals[r.currency]||0)+Math.round(r.amount*100));return Object.entries(totals).map(([c,v])=>'¥ '+(v/100).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2})).join(' / ')||'—'};$('amount').textContent=formatAmount(visible);$('pendingAmount').textContent=formatAmount(visible.filter(r=>r.review==='待核对'));$('doneAmount').textContent=formatAmount(visible.filter(r=>r.review==='已核对'));$('pending').textContent=visible.filter(r=>r.review==='待核对').length;$('done').textContent=visible.filter(r=>r.review==='已核对').length;$('count').textContent=`共 ${visible.length} 条记录 · 统计随筛选结果更新`;}function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2500)}function close(){$('overlay').style.display='none'}function open(id,check){current=records.find(r=>r.id===Number(id));let r=current;if(check&&r.review==='已核对'){toast('该记录已核对，请刷新列表查看');return}$('title').textContent=check?'核对记录':'订单关联详情（只读）';$('body').innerHTML=check?`<div class="field"><label>充值订单号</label>${r.order}</div><div class="field"><label>核对状态</label><select id="editStatus"><option selected>已核对</option></select></div><div class="field"><label>核对备注 <span class="muted">（选填，最多500字）</span></label><textarea id="editNote" maxlength="500" placeholder="请输入核对结果或需要跟进的事项">${esc(r.note)}</textarea></div><div class="notice">保存仅更新核对记录，不修改充值或提现订单。</div>`:`<div class="section">充值订单</div><div class="details"><span>订单号</span><span>${r.order}</span><span>用户</span><span>${r.name} / ${r.user}</span><span>订单金额</span><span>¥${r.amount.toFixed(2)}</span><span>交易状态</span><span>${r.trade}</span><span>原订单备注</span><span>付款超时后，收到用户确认付款通知（示例）</span><span>原始凭证</span><span>无</span></div><div class="section">关联提现订单</div><div class="details"><span>订单号</span><span>${r.withdraw}</span><span>商户提现订单号</span><span>${r.merchantWithdraw}</span><span>订单状态</span><span>${r.withdrawState}</span><span>是否拆单</span><span>是（示例）</span></div><div class="notice">关联提现金额可能对应多笔充值，不能作为本笔充值的到账依据。</div><div class="section">核对记录</div><div class="details"><span>超时时间</span><span>${r.timeout}</span><span>确认付款时间</span><span>${r.clicked}</span><span>核对状态</span><span>${r.review}</span><span>核对备注</span><span>${esc(r.note)||'—'}</span></div>`;$('footer').innerHTML=check?'<button id="cancel">取消</button><button class="blue" id="save">保存</button>':'<button id="cancel">关闭</button>';$('cancel').onclick=close;if(check)$('save').onclick=()=>{if(r.review==='已核对'){close();render();toast('该记录已核对，请刷新列表查看');return}r.review=$('editStatus').value;r.note=$('editNote').value.trim();r.operator='当前运营';r.reviewTime=new Date().toLocaleString('sv-SE',{timeZone:'Asia/Kuala_Lumpur'});r.history.push(`${r.reviewTime} 当前运营：${r.review}；备注：${r.note||'无'}`);close();render();toast('核对记录已保存（仅当前页面会话）')};$('overlay').style.display='flex'}document.addEventListener('click',e=>{let t=e.target;if(t.dataset.view)open(t.dataset.view,false);if(t.dataset.check)open(t.dataset.check,true);if(t.dataset.channel){channel=t.dataset.channel;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===t));render()}if(t.dataset.days){let d=new Date('2026-10-12T12:00:00Z');d.setUTCDate(d.getUTCDate()-Number(t.dataset.days)+1);$('from').value=d.toISOString().slice(0,10);$('to').value='2026-10-12';render()}});$('query').onclick=()=>{if($('from').value&&$('to').value&&$('from').value>$('to').value){toast('开始日期不能晚于结束日期');return}render()};$('reset').onclick=()=>{$('keyword').value='';['review'].forEach(id=>$(id).value='');$('searchType').value='order';$('from').value=$('to').value='2026-10-12';render()};$('export').onclick=()=>{const heads=['充值订单号','商户充值订单号','提现订单号','用户ID','订单金额（元）','超时时间','确认付款时间','核对状态','核对备注','核对人','核对时间'];const keys=['order','merchantOrder','withdraw','user','amount','timeout','clicked','review','note','operator','reviewTime'];const cell=v=>'"'+String(v??'').replace(/^[=+@-]/,"'$&").replace(/"/g,'""')+'"';let csv='\ufeff'+[heads.map(cell).join(','),...visible.map(r=>keys.map(k=>cell(r[k])).join(','))].join('\r\n');let url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));let a=document.createElement('a');a.href=url;a.download='超时订单核对_示例.csv';a.click();URL.revokeObjectURL(url);toast('已导出当前筛选结果')};$('overlay').onclick=e=>{if(e.target===$('overlay'))close()};document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});render();
</script></html>
